name: API Automation Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run API tests
        id: api_tests
        run: |
          python -m pytest tests/ -v --alluredir=allure-results


      - name: Add Allure environment and executor info
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          mkdir -p allure-results

          echo "Python=3.13" >> allure-results/environment.properties
          echo "OS=Ubuntu" >> allure-results/environment.properties
          echo "Framework=Pytest" >> allure-results/environment.properties
          echo "API=JSONPlaceholder" >> allure-results/environment.properties

          python -c 'import json, os, pathlib; url = f"{os.environ["SERVER_URL"]}/{os.environ["REPOSITORY"]}/actions/runs/{os.environ["RUN_ID"]}"; data = {"name": "GitHub Actions", "type": "github", "buildName": f"Run #{os.environ["RUN_NUMBER"]}", "buildUrl": url, "reportName": "API Automation Tests", "reportUrl": url}; pathlib.Path("allure-results/executor.json").write_text(json.dumps(data, indent=2), encoding="utf-8")'

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          if-no-files-found: warn
      - name: Generate Allure HTML report
        if: always()
        run: |
          npm install -g allure-commandline@2.36.0
          allure generate allure-results --clean -o allure-report

      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-html-report
          path: allure-report/
          if-no-files-found: warn

      - name: Notify n8n about CI result
        if: ${{ always() && github.event_name != 'pull_request' }}
        continue-on-error: true
        env:
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
          N8N_WEBHOOK_SECRET: ${{ secrets.N8N_WEBHOOK_SECRET }}
          TEST_OUTCOME: ${{ steps.api_tests.outcome }}
          PROJECT: ${{ github.event.repository.name }}
          BRANCH: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          webhook_url = os.environ.get("N8N_WEBHOOK_URL")
          webhook_secret = os.environ.get("N8N_WEBHOOK_SECRET")
          test_outcome = os.environ.get("TEST_OUTCOME")

          if not webhook_url or not webhook_secret:
              print("n8n secrets are missing; skipping notification.")
              raise SystemExit(0)

          if test_outcome not in ("success", "failure"):
              print(f"Test outcome is {test_outcome!r}; skipping notification.")
              raise SystemExit(0)

          payload = {
              "project": os.environ["PROJECT"],
              "status": test_outcome,
              "branch": os.environ["BRANCH"],
              "run_id": int(os.environ["RUN_ID"]),
              "run_url": os.environ["RUN_URL"],
          }

          request = urllib.request.Request(
              webhook_url,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "X-Webhook-Secret": webhook_secret,
              },
              method="POST",
          )

          with urllib.request.urlopen(request, timeout=10) as response:
              print(f"n8n notification sent. HTTP status: {response.status}")
          PY