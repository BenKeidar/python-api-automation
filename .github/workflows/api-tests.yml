name: API Automation Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run API tests
        run: |
          python -m pytest tests/ -v --alluredir=allure-results


      - name: Add Allure environment and executor info
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          mkdir -p allure-results

          cat > allure-results/environment.properties <<EOF
          Python=3.13
          OS=Ubuntu
          Framework=Pytest
          API=JSONPlaceholder
          EOF

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          build_url = (
              f"{os.environ['SERVER_URL']}/"
              f"{os.environ['REPOSITORY']}/actions/runs/"
              f"{os.environ['RUN_ID']}"
          )

          executor = {
              "name": "GitHub Actions",
              "type": "github",
              "buildName": f"Run #{os.environ['RUN_NUMBER']}",
              "buildUrl": build_url,
              "reportName": "API Automation Tests",
              "reportUrl": build_url,
          }

          Path("allure-results/executor.json").write_text(
              json.dumps(executor, indent=2),
              encoding="utf-8"
          )
          PY  

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          if-no-files-found: warn
      - name: Generate Allure HTML report
        if: always()
        run: |
          npm install -g allure-commandline@2.36.0
          allure generate allure-results --clean -o allure-report

      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-html-report
          path: allure-report/
          if-no-files-found: warn    